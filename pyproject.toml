[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-flow"
version = "0.1.0"
description = "Training, inference, and basic evaluation for Multimodal Flow"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "Pillow>=10",
    "pyarrow>=15",
    "pydantic>=2",
    "PyYAML>=6",
    "huggingface-hub>=0.26",
    "safetensors>=0.5",
    "tensorboard>=2.16",
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=4.43",
    "typing_extensions>=4.7",
]

[project.optional-dependencies]
cuda = ["flash-attn>=2.7"]
dev = [
    "ruff>=0.8",
]

[project.scripts]
mf = "mf.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/multimodal-flow/configs" = [
    "configs/pretrain.yaml",
    "configs/sft.yaml",
    "configs/quickstart-0.6b.yaml",
    "configs/quickstart-1.6b.yaml",
]
